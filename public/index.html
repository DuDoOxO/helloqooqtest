<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello qooq 留言板</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #f6f7f9; color: #222; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    form { display: flex; flex-direction: column; gap: 8px; background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    input, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; margin: 8px 0; padding: 12px 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); position: relative; }
    li .meta { color: #888; font-size: 12px; }
    li .del { position: absolute; top: 8px; right: 8px; background: #ef4444; padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Hello qooq 留言板</h1>
  <p class="sub">前後端同一個 Node server · <span id="status">檢查中…</span></p>
  <form id="form">
    <input id="name" placeholder="名字" maxlength="50" required>
    <textarea id="text" placeholder="想說的話" maxlength="500" rows="3" required></textarea>
    <button type="submit">送出</button>
  </form>
  <ul id="list"></ul>
  <script src="/app.js"></script>
</body>
</html>
